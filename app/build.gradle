plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'ru.yetidrive.launcher'
    compileSdk 35

    defaultConfig {
        applicationId 'ru.yetidrive.launcher'
        minSdk 26
        targetSdk 32
        versionCode 5
        versionName '0.5-yandex'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}
